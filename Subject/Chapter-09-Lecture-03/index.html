<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAE Message</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
            font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, sans-serif;
            direction: rtl;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 400px;
        }

        .gradient-text {
            font-size: 2rem;
            font-weight: bold;
            line-height: 1.8;
            background: linear-gradient(45deg, #ff7eb3, #ff758c, #7afcff, #feff9c);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: multicolor 6s ease infinite;
        }

        .signature {
            margin-top: 20px;
            font-size: 1.4rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        @keyframes multicolor {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="gradient-text">
            پریشان مت ہوں۔ میں بہت جلد آپ کے سامنے ہوں گی۔
        </div>
        <span class="signature">آپ کی اپنی IAE</span>
    </div>

</body>
</html>
