<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAE Welcome Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Nastaliq Urdu', serif;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Background */
        .bg-glow {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.18) 0%, rgba(236, 72, 153, 0.18) 40%, transparent 70%);
            border-radius: 50%;
            animation: pulse 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.9; }
        }

        /* سکرین کے بالکل سینٹر (Center) کے لیے پوزیشننگ */
        .card-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 650px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(168, 85, 247, 0.2);
            z-index: 10;
        }

        #butterflyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }

        .heading-badge {
            display: inline-block;
            padding: 6px 22px;
            background: linear-gradient(135deg, rgba(236,72,153,0.2), rgba(139,92,246,0.2));
            border: 1px solid rgba(236,72,153,0.4);
            border-radius: 50px;
            color: #f472b6;
            font-size: 1.15rem;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(236,72,153,0.3);
        }

        .message-body {
            font-size: 1.35rem;
            line-height: 2.3;
            font-weight: 400;
            margin-bottom: 30px;
            direction: rtl;
        }

        /* الفاظ پر اینیمیشن کا اثر */
        .word {
            display: inline-block;
            white-space: pre;
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 35%, #fbcfe8 70%, #bae6fd 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            transform: scale(1);
        }

        .word.hidden {
            opacity: 0;
            transform: scale(0.6);
        }

        .footer-wrap {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .wisher {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card-container" id="cardContainer">
        <canvas id="butterflyCanvas"></canvas>

        <div class="heading-badge" id="badge">✨ خوش آمدید!</div>

        <div class="message-body" id="textContainer"></div>

        <div class="footer-wrap" id="footer">
            <div class="wisher">آپ کی خیر خواہ</div>
            <div class="brand-name">امپیریل اکیڈمی آف ایجوکیشن</div>
        </div>
    </div>

    <script>
        const fullMessage = "آپ کا سفر محض لفظوں اور کتابوں کا نہیں، بلکہ اپنے خوابوں کو حقیقت کا روپ دینے کا ہے۔ آپ کے اندر وہ تمام صلاحیت، عزم اور طاقت موجود ہے جو آپ کو ہر بلندی تک پہنچا سکتی ہے۔\n
          \nیاد رکھیں، ہر نیا دن ایک نیا موقع ہے—کچھ نیا سیکھنے کا، ایک قدم اور آگے بڑھنے کا، اور خود کو کل سے بہتر بنانے کا۔ ماضی کی رکاوٹوں کو بھول جائیں اور پوری توانائی کے ساتھ اپنے مقصد پر توجہ مرکوز کریں۔\n
          \nآج ہی سے، پورے دل اور جذبے کے ساتھ شروعات کریں۔ کامیابی آپ کی منتظر ہے!";

        const textContainer = document.getElementById('textContainer');
        const cardContainer = document.getElementById('cardContainer');
        const canvas = document.getElementById('butterflyCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = cardContainer.clientWidth;
            canvas.height = cardContainer.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // الفاظ کو الگ الگ ٹکڑوں میں تقسیم کرنا
        const paragraphs = fullMessage.split('\n\n');
        paragraphs.forEach((paragraphText) => {
            const pElem = document.createElement('p');
            pElem.style.marginBottom = '15px';
            
            const words = paragraphText.split(' ');
            words.forEach((wordText) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                wordSpan.textContent = wordText + ' ';
                pElem.appendChild(wordSpan);
            });
            textContainer.appendChild(pElem);
        });

        const wordSpans = Array.from(document.querySelectorAll('.word'));
        let butterflies = [];

        class Butterfly {
            constructor(startX, startY, targetX, targetY, mode) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.mode = mode;
                this.progress = 0;

                this.size = Math.random() * 7 + 5;
                this.color = `hsl(${Math.random() * 70 + 270}, 95%, 75%)`;
                this.wingAngle = Math.random() * Math.PI;
                this.wingSpeed = 0.2 + Math.random() * 0.1;
                
                this.cpX = startX + (Math.random() - 0.5) * 180;
                this.cpY = startY + (Math.random() - 0.5) * 180;
                this.speed = 0.02 + Math.random() * 0.015;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                this.wingAngle += this.wingSpeed;
                const wingScale = Math.abs(Math.sin(this.wingAngle));

                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;

                ctx.beginPath();
                ctx.ellipse(-this.size / 2 * wingScale, 0, this.size / 2 * wingScale, this.size / 3, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(this.size / 2 * wingScale, 0, this.size / 2 * wingScale, this.size / 3, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, 1.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            update() {
                this.progress += this.speed;
                if (this.progress > 1) this.progress = 1;

                const t = this.progress;
                if (this.mode === 'FLY_OUT') {
                    this.x = (1-t)*(1-t)*this.startX + 2*(1-t)*t*this.cpX + t*t*this.targetX;
                    this.y = (1-t)*(1-t)*this.startY + 2*(1-t)*t*this.cpY + t*t*this.targetY;
                } else {
                    this.x = (1-t)*this.startX + t*this.targetX;
                    this.y = (1-t)*(1-t)*this.startY + 2*(1-t)*t*this.cpX + t*t*this.targetY;
                }
            }
        }

        function startAnimationCycle() {
            // 1. لفظ بہ لفظ تتلیوں میں بدل کر غائب ہونا
            wordSpans.forEach((span, index) => {
                setTimeout(() => {
                    const rect = span.getBoundingClientRect();
                    const cardRect = cardContainer.getBoundingClientRect();

                    const wordX = rect.left - cardRect.left + rect.width / 2;
                    const wordY = rect.top - cardRect.top + rect.height / 2;

                    for(let i = 0; i < 2; i++) {
                        const targetX = wordX + (Math.random() - 0.5) * 400;
                        const targetY = wordY - Math.random() * 300 - 50;
                        butterflies.push(new Butterfly(wordX, wordY, targetX, targetY, 'FLY_OUT'));
                    }

                    span.classList.add('hidden');
                }, index * 45);
            });

            const totalOutTime = wordSpans.length * 45 + 1000;

            // 2. تتلیوں کا واپس آکر دوبارہ لفظ بننا (حاضر ہونا)
            setTimeout(() => {
                butterflies = [];

                wordSpans.forEach((span, index) => {
                    const rect = span.getBoundingClientRect();
                    const cardRect = cardContainer.getBoundingClientRect();

                    const wordX = rect.left - cardRect.left + rect.width / 2;
                    const wordY = rect.top - cardRect.top + rect.height / 2;

                    const angle = Math.random() * Math.PI * 2;
                    const distance = 400;
                    const startX = canvas.width / 2 + Math.cos(angle) * distance;
                    const startY = canvas.height / 2 + Math.sin(angle) * distance;

                    butterflies.push(new Butterfly(startX, startY, wordX, wordY, 'FLY_IN'));

                    setTimeout(() => {
                        span.classList.remove('hidden');
                    }, index * 45);
                });
            }, totalOutTime);
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            butterflies.forEach(b => {
                b.update();
                b.draw();
            });
            requestAnimationFrame(renderLoop);
        }

        renderLoop();

        // 5 سیکنڈ کے وقفے کے بعد مستقل اینیمیشن سائیکل
        setTimeout(() => {
            startAnimationCycle();
            setInterval(startAnimationCycle, wordSpans.length * 90 + 5000);
        }, 5000);
    </script>
</body>
</html>
