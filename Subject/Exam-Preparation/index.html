<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Imperial Academy of Education — Biology Examination</title>
  <link rel="stylesheet" href="./styles/med.css">
</head>
<body>
  <header role="banner">
    <h1>Imperial Academy of Education</h1>
    <p>First Year Biology — Examination System</p>
  </header>

  <nav aria-label="Primary" class="nav">
    <button id="btnHome" class="btn">مین پیج</button>
    <button id="btnBoard" class="btn">پشاور بورڈ</button>
    <button id="btnMed" class="btn">میڈکیٹ</button>
  </nav>

  <main id="app" role="main" class="container">
    <section id="templates" hidden>
      <template id="tmpl-question">
        <article class="qcard" role="region" aria-live="polite">
          <h3 class="qtext"></h3>
          <ul class="options" role="list"></ul>
        </article>
      </template>
    </section>

    <section id="mainPanel" class="panel"></section>

    <div id="medLecture" class="hidden" aria-hidden="true"></div>
    <div id="medMethodology" class="hidden" aria-hidden="true"></div>
  </main>

  <footer role="contentinfo">Imperial Academy of Education — Biology Examination</footer>

  <script type="module" src="./scripts/app.js" defer></script>
</body>
</html>
