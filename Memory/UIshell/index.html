<script>
(function(){'use strict';
const levels=[
 {title:'',items:[['',['','','',''],0],['',['','','',''],0],['',['','','',''],0]]},
 {title:'',items:[['',['','','',''],0],['',['','','',''],0],['',['','','',''],0]]},
 {title:'',items:[['',['','','',''],0],['',['','','',''],0],['',['','','',''],0]]},
 {title:'',items:[['',['','','',''],0],['',['','','',''],0],['',['','','',''],0]]},
 {title:'',items:[['',['','','',''],0],['',['','','',''],0],['',['','','',''],0]]}
];
let level=0,index=0,score=0,locked=false,timer=null,questionTimer=null,safetyTimer=null,startedAt=0,unattempted=0;
const $=id=>document.getElementById(id);
function total(){return levels.reduce((n,l)=>n+l.items.length,0)}
function completed(){return levels.slice(0,level).reduce((n,l)=>n+l.items.length,0)+index}
function shuffleHitCeilingOptions(options){const a=options.map((text,i)=>({text,index:i}));for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildLevels(){const host=$('htc14Levels');if(!host)return;host.innerHTML=levels.map((l,i)=>`<button type="button" class="htc14-lvl ${i===level?'active':''} ${i<level?'done':''}" aria-label="Level ${i+1}">${String(i+1).padStart(2,'0')}</button>`).join('');[...host.querySelectorAll('.htc14-lvl')].forEach((b,i)=>b.addEventListener('click',()=>{if(i<=level){level=i;index=0;score=levels.slice(0,i).reduce((n,l)=>n+l.items.length,0);render()}}))}
function update(){const pct=Math.round(completed()/Math.max(1,total())*100),bar=$('htc14ProgressBar');if(bar)bar.style.width=Math.min(100,pct)+'%';if($('htc14Level'))$('htc14Level').textContent='Level '+String(level+1).padStart(2,'0')+' · '+levels[level].title;if($('htc14Count'))$('htc14Count').textContent='Question '+(index+1)+' / '+levels[level].items.length+' · Score: '+score;buildLevels();syncTower()}
function syncTower(){const body=$('htc14Segments');if(!body)return;const max=levels.length,done=level+(index/Math.max(1,levels[level].items.length));body.innerHTML=Array.from({length:max},(_,i)=>`<div class="htc14-seg ${i<done?'on':''}"></div>`).join('');const flame=$('htc14Flame');if(flame)flame.classList.toggle('on',completed()>0)}
function render(){clearTimeout(timer);clearTimeout(questionTimer);locked=false;const play=$('htc14Play'),clear=$('htc14Cleared');if(clear)clear.hidden=true;if(play)play.style.display='flex';if(level>=levels.length){finish();return}update();const card=$('htc14Card');if(!card)return;const q=levels[level].items[index];card.innerHTML='<div class="htc14-q"></div><div class="htc14-answers"></div><div class="htc14-feedback" aria-live="polite"></div>';card.querySelector('.htc14-q').textContent=q[0];const wrap=card.querySelector('.htc14-answers'),fb=card.querySelector('.htc14-feedback');shuffleHitCeilingOptions(q[1]).forEach((option,i)=>{const b=document.createElement('button');b.type='button';b.className='htc14-answer answer-color-'+i;b.setAttribute('data-option',String(option.index+1));b.textContent=option.text;b.addEventListener('click',()=>answer(option.index,q,fb,[...wrap.querySelectorAll('button')]));wrap.appendChild(b)});questionTimer=setTimeout(()=>{if(locked)return;locked=true;unattempted++;[...wrap.querySelectorAll('button')].forEach(b=>b.disabled=true);fb.textContent='⏱ وقت ختم — سوال UNATTEMPTED کے طور پر محفوظ ہے۔';fb.style.color='var(--muted)';timer=setTimeout(()=>{locked=false;next()},700)},20000)}
function answer(i,q,fb,buttons){if(locked)return;clearTimeout(questionTimer);locked=true;buttons.forEach(b=>b.disabled=true);if(i===q[2]){score++;fb.textContent='✓ درست — اگلا challenge تیار ہو رہا ہے۔';fb.style.color='var(--green)';timer=setTimeout(()=>{locked=false;next()},450)}else{fb.textContent='✗ دوبارہ کوشش کریں — صحیح concept پر غور کریں۔';fb.style.color='var(--red)';locked=false;buttons.forEach(b=>b.disabled=false)}}
function next(){clearTimeout(questionTimer);index++;if(index>=levels[level].items.length){level++;index=0}if(level>=levels.length){finish();return}render()}
function finish(){clearTimeout(timer);clearTimeout(questionTimer);clearTimeout(safetyTimer);const play=$('htc14Play'),clear=$('htc14Cleared');if(play)play.style.display='none';if(clear)clear.hidden=false;const flame=$('htc14Flame');if(flame)flame.classList.add('on')}
function start(){clearTimeout(timer);clearTimeout(questionTimer);clearTimeout(safetyTimer);level=0;index=0;score=0;unattempted=0;locked=false;startedAt=Date.now();safetyTimer=setTimeout(()=>{clearTimeout(questionTimer);locked=true;finish()},300000);const play=$('htc14Play'),clear=$('htc14Cleared');if(play)play.style.display='flex';if(clear)clear.hidden=true;render()}
function resetMarking(){clearTimeout(timer);clearTimeout(questionTimer);clearTimeout(safetyTimer);level=0;index=0;score=0;unattempted=0;locked=false;startedAt=Date.now();safetyTimer=setTimeout(()=>{clearTimeout(questionTimer);locked=true;finish()},300000);render()}
function exitGame(){clearTimeout(timer);clearTimeout(questionTimer);clearTimeout(safetyTimer);locked=true;returnToPreviousView()}
const ex=$('htc14Exit');if(ex)ex.addEventListener('click',exitGame);const bt=$('htc14BackTop');if(bt)bt.addEventListener('click',exitGame);window.htc14Start=start;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script></section>

const topics={"t1":{"title":"Phase Changes","id":"IAE1102050300","visual":"IAE1102050300V","intro":"Phase changes are physical transformations between solid, liquid and gas states. Their direction, energy flow, equilibrium conditions and temperature dependence can be explained through particle motion and intermolecular attractions.","basic":"Melting, freezing, vaporisation, evaporation and condensation are phase changes. The chemical identity of the substance remains the same while its physical state changes.","standard":"Relate each phase transition to energy transfer, molecular motion, intermolecular attraction, temperature and pressure. Distinguish surface evaporation from bulk vaporisation.","mastery":"Use particle-level reasoning to predict the direction of a phase change and explain latent heat, vapour pressure, equilibrium and temperature-dependent phase behaviour."},"t2":{"title":"Liquid-Crystal Concept","id":"IAE1102050400","visual":"IAE1102050400V","intro":"Liquid crystals are condensed phases that retain fluid-like mobility while showing a degree of molecular ordering. Their orientational order gives rise to distinctive optical and electrical responses.","basic":"Liquid-crystal materials occupy an intermediate regime between an ordinary liquid and a fully ordered crystal. Their elongated or otherwise anisotropic molecules can show preferred alignment while remaining able to flow.","standard":"Explain molecular ordering, anisotropy and field-controlled alignment, and connect these ideas to liquid-crystal properties and display technology.","mastery":"Connect molecular organisation to macroscopic optical behaviour and device operation, including how an applied electric field can alter molecular orientation and light transmission."}};
const subs={"s16001":{"id":"IAE1102050301","topic":"t1","title":"Evaporation","visual":"IAE1102050301V","basic":"Evaporation is the escape of higher-energy particles from the surface of a liquid into the gas phase. It can occur below the boiling point.","standard":"Evaporation is faster when temperature is higher, the exposed surface area is larger, or vapour is removed from above the liquid. Stronger intermolecular attractions generally make escape more difficult.","mastery":"Explain evaporation as a surface process caused by the energy distribution of liquid particles. Cooling by evaporation occurs because escaping particles carry energy away from the liquid.","extra":"Surface process: liquid → gas; higher temperature and greater exposed area generally increase evaporation."},"s16002":{"id":"IAE1102050302","topic":"t1","title":"Vaporisation","visual":"IAE1102050302V","basic":"Vaporisation is the liquid-to-gas phase transition. It includes evaporation at the surface and boiling throughout the liquid when the vapour pressure matches the external pressure.","standard":"Vaporisation requires energy to separate particles against intermolecular attractions. At a given pressure, the boiling temperature is the temperature at which liquid and vapour can coexist with equal escaping and returning rates at equilibrium.","mastery":"Distinguish evaporation from boiling and relate both to molecular energy, vapour pressure and external pressure. The enthalpy of vaporisation is positive for the forward process.","extra":"Liquid → gas; ΔH_vap > 0. Boiling occurs when vapour pressure equals external pressure."},"s16003":{"id":"IAE1102050303","topic":"t1","title":"Condensation","visual":"IAE1102050303V","basic":"Condensation is the gas-to-liquid transition. Gas particles lose sufficient energy and become associated in the condensed phase.","standard":"At equilibrium in a closed system, vaporisation and condensation can occur simultaneously at equal rates. Condensation releases energy to the surroundings because it is the reverse of vaporisation.","mastery":"Use dynamic equilibrium to explain condensation and connect the sign and magnitude of its enthalpy change with the enthalpy of vaporisation.","extra":"Gas → liquid; ΔH_cond = −ΔH_vap."},"s16004":{"id":"IAE1102050304","topic":"t1","title":"Melting and Freezing","visual":"IAE1102050304V","basic":"Melting changes a solid into a liquid; freezing changes a liquid into a solid. At the phase-transition temperature, the two processes can occur in opposite directions.","standard":"Melting absorbs energy because intermolecular or lattice attractions must be sufficiently disrupted. Freezing releases the corresponding energy as particles become more ordered and associated.","mastery":"Interpret a heating or cooling curve and explain why temperature can remain constant while latent heat is transferred during a phase transition.","extra":"Solid ⇌ liquid; ΔH_fus > 0 and ΔH_freeze = −ΔH_fus."},"s16005":{"id":"IAE1102050401","topic":"t2","title":"Liquid-Crystal Concept","visual":"IAE1102050401V","basic":"A liquid crystal is a phase with fluid-like mobility but significant molecular order. Many liquid-crystal molecules are anisotropic and tend to align preferentially.","standard":"The degree and type of order can depend on temperature, composition and applied fields. This partial order distinguishes liquid-crystalline phases from ordinary liquids and rigid crystals.","mastery":"Explain the intermediate structural character of liquid crystals using molecular orientation, mobility and anisotropy.","extra":"Fluid mobility + partial orientational order → liquid-crystalline behaviour."},"s16006":{"id":"IAE1102050402","topic":"t2","title":"Properties","visual":"IAE1102050402V","basic":"Liquid crystals can show anisotropic optical, dielectric and other physical properties because their molecules are preferentially oriented.","standard":"Optical response can depend on molecular alignment and polarisation. External electric fields can alter orientation in many display materials, changing how light passes through the device.","mastery":"Connect molecular anisotropy and orientation to observable properties such as birefringence and field-dependent optical transmission.","extra":"Molecular orientation → anisotropic response → controllable optical behaviour."},"s16007":{"id":"IAE1102050403","topic":"t2","title":"Applications","visual":"IAE1102050403V","basic":"Liquid-crystal technology uses controlled molecular orientation to manipulate light. The best-known application is the liquid-crystal display (LCD).","standard":"In an LCD, polarizers, electrodes and a liquid-crystal layer work together. Applying an electric field changes molecular orientation and therefore the polarization state or transmission of light through the optical stack.","mastery":"Trace the device-level sequence from applied voltage to molecular reorientation to optical response, without treating the liquid crystal as a conventional liquid or solid.","extra":"Electrical control → molecular alignment change → optical transmission change → displayed information."},"s16008":{"id":"IAE1102050305","topic":"t1","title":"Enthalpy of Phase Transitions","visual":"IAE1102050305V","basic":"Enthalpy change for a phase transition measures heat absorbed or released at constant pressure. For a transition of n moles, q_p = ΔH when pressure-volume work is the only work.","standard":"Useful molar quantities include ΔH_vap for vaporisation and ΔH_fus for melting. Reverse transitions have equal magnitude and opposite sign: ΔH_cond = −ΔH_vap and ΔH_freeze = −ΔH_fus.","mastery":"Apply q = nΔH_transition for molar enthalpy data and Q = mL for mass-specific latent heat. During a pure phase transition at equilibrium, supplied heat changes phase rather than temperature.","extra":"At constant pressure: q_p = ΔH; for molar data q = nΔH; for latent heat per mass Q = mL."},"s16009":{"id":"IAE1102050404","topic":"t2","title":"Molecular Ordering and Advanced Applications","visual":"IAE1102050404V","basic":"Liquid-crystal behaviour depends on collective molecular ordering rather than on a single isolated molecule. Ordered domains can produce direction-dependent responses.","standard":"Advanced devices exploit changes in molecular orientation caused by temperature, surfaces, electric fields or other controlled conditions. Molecular order is therefore a design variable in optical technologies.","mastery":"Move from molecular shape and alignment to collective optical response and then to device function. The key link is structure → ordering → anisotropy → controlled response.","extra":"Anisotropic molecules + collective ordering → directional optical/electrical response."},"s16010":{"id":"IAE1102050306","topic":"t1","title":"Vapour Pressure and Evaporation","visual":"IAE1102050306V","basic":"Vapour pressure is the pressure exerted by vapour in equilibrium with its condensed phase at a specified temperature. Evaporation and condensation continue microscopically at dynamic equilibrium.","standard":"Vapour pressure increases with temperature because a larger fraction of particles has enough energy to enter the gas phase. Stronger intermolecular attractions generally lower vapour pressure at a comparable temperature.","mastery":"Use vapour pressure to explain volatility and boiling. A liquid boils when its vapour pressure reaches the external pressure.","extra":"Temperature ↑ → vapour pressure ↑; boiling when P_vapour = P_external."},"s16011":{"id":"IAE1102050307","topic":"t1","title":"Energy Changes during Phase Transitions","visual":"IAE1102050307V","basic":"Phase transitions involve energy transfer even when the temperature of the pure substance remains constant during the transition.","standard":"Endothermic transitions—melting and vaporisation—absorb energy. Exothermic reverse transitions—freezing and condensation—release energy. The energy is associated with changes in intermolecular organisation and separation.","mastery":"Combine sensible heating with latent heat when analysing a multi-stage heating or cooling process: Q_total can be the sum of m c ΔT terms and mL terms.","extra":"Within a phase change, latent heat changes molecular organisation; temperature remains constant for an ideal pure-substance transition at equilibrium."},"s16012":{"id":"IAE1102050405","topic":"t2","title":"Liquid-Crystal Molecular Organisation","visual":"IAE1102050405V","basic":"Liquid-crystal molecules can form ordered arrangements in which their long axes tend to align, while the material remains capable of flow.","standard":"Molecular organisation may be described by orientational order rather than the fixed positional order of a conventional crystal. The degree of alignment strongly influences optical response.","mastery":"Explain why a material can have substantial molecular orientation without behaving as a rigid solid, and relate alignment to anisotropic properties.","extra":"Orientational order without complete positional rigidity is a defining structural idea in liquid crystals."},"s16013":{"id":"IAE1102050308","topic":"t1","title":"Temperature Dependence of Phase Change","visual":"IAE1102050308V","basic":"Temperature affects the kinetic-energy distribution of particles and therefore changes the rates and equilibria associated with phase transitions.","standard":"As temperature rises, vapour pressure generally increases. Phase-transition temperatures also depend on pressure; for example, lowering external pressure lowers the boiling temperature of a liquid.","mastery":"Interpret temperature and pressure together when predicting evaporation, boiling, condensation and other phase behaviour. Use qualitative Clausius–Clapeyron reasoning when appropriate.","extra":"Temperature ↑ → molecular kinetic energy distribution shifts → vapour pressure generally ↑; pressure changes shift transition conditions."},"s16014":{"id":"IAE1102050406","topic":"t2","title":"Advanced Liquid-Crystal Applications","visual":"IAE1102050406V","basic":"Advanced liquid-crystal applications use controllable molecular orientation to regulate light, sensing, imaging or other device responses.","standard":"LCDs are a major example: an applied field changes molecular alignment in a liquid-crystal layer, which changes the optical state of the cell. More advanced systems may exploit different liquid-crystal phases or responsive materials.","mastery":"Analyse an application by identifying the stimulus, molecular response, property change and final device function.","extra":"Stimulus → molecular reorientation → anisotropic property change → engineered device output."}};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function linkDictionaryTerms(text){
 let out=esc(text);
 const tokens=[];
 const keys=Object.keys(dict).sort((a,b)=>b.length-a.length);
 for(const k of keys){
   const aliases=[k,dict[k][0]].filter(Boolean).sort((a,b)=>b.length-a.length);
   for(const alias of aliases){
     const safe=alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
     out=out.replace(new RegExp('('+safe+')','g'),(m)=>{
       const i=tokens.length;
       tokens.push('<button class="linked-word" type="button" data-term="'+esc(k)+'">'+m+'</button>');
       return '\uE000'+i+'\uE001';
     });
   }
 }
 return out.replace(/\uE000(\d+)\uE001/g,(_,i)=>tokens[Number(i)]);
}

function masteryTTSSplitText(text){
  const normalized=String(text||'').replace(/\s+/g,' ').trim();
  if(!normalized)return [];
  const sentences=normalized.match(/[^۔!?]+[۔!?]?/g)||[normalized];
  const chunks=[];
  let buf='';
  const pushBuf=()=>{if(buf.trim()){chunks.push(buf.trim());buf='';}};
  for(const sentence of sentences){
    const s=sentence.trim();
    if(!s)continue;
    if(s.length<=MASTERY_TTS_MAX_CHARS){
      if((buf+' '+s).trim().length<=MASTERY_TTS_MAX_CHARS) buf=(buf+' '+s).trim();
      else {pushBuf();buf=s;}
    }else{
      pushBuf();
      const words=s.split(/\s+/);
      for(const w of words){
        if((buf+' '+w).trim().length<=MASTERY_TTS_MAX_CHARS) buf=(buf+' '+w).trim();
        else {pushBuf();buf=w;}
      }
    }
  }
  pushBuf();
  return chunks;
}

async function playSpeechSynthesisChunk(item,chunks,chunk){
 if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance==='undefined') throw new Error('Speech synthesis unavailable');
 masteryTTSUsingSpeechSynthesis=true;
 await new Promise((resolve,reject)=>{
   let settled=false;
   const finish=(ok)=>{if(settled)return;settled=true;masteryTTSSpeechResolve=null;masteryTTSUsingSpeechSynthesis=false;ok?resolve():reject(new Error('Speech synthesis failed'));};
   const utter=new SpeechSynthesisUtterance(chunk);
   const voices=typeof speechSynthesis.getVoices==='function'?speechSynthesis.getVoices():[];
   const urVoice=voices.find(v=>/^ur(-|$)/i.test(v.lang));
   if(urVoice)utter.voice=urVoice;
   utter.lang=urVoice?.lang||'ur-PK'; utter.rate=0.9; utter.pitch=1;
   utter.onend=()=>{masteryTTSChunkIndex++;finish(true);};
   utter.onerror=()=>finish(false);
   masteryTTSSpeechResolve=()=>finish(true);
   try{speechSynthesis.cancel();speechSynthesis.speak(utter);}catch(e){finish(false);return;}
   /* Some Android engines can fail to emit onend/onerror. Give the local engine
      a generous watchdog, then let the online audio path take over. */
   setTimeout(()=>{if(!settled){try{speechSynthesis.cancel();}catch(e){}finish(false);}},Math.max(30000,chunk.length*500));
 });
 await playNextMasteryChunk(item,chunks);
}
async function playNextMasteryChunk(item,chunks){

   let done=false;
   const finish=(ok)=>{if(done)return;done=true;audio.onended=null;audio.onerror=null;ok?resolve():reject(new Error('Audio playback failed'));};
   audio.onended=()=>{masteryTTSCurrentAudio=null;updateMasteryPausePlayButton();masteryTTSChunkIndex++;finish(true);};
   audio.onerror=()=>{masteryTTSCurrentAudio=null;updateMasteryPausePlayButton();finish(false);};

 });
}

     for(const alias of aliases){
       const safe=alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
       out=out.replace(new RegExp('('+safe+')','gi'),m=>{
         const i=tokens.length;
         tokens.push(`<button class="linked-word" type="button" data-term="${esc(k)}">${esc(m)}</button>`);
         return '\uE000'+i+'\uE001';
       });
     }
   }
   node.innerHTML=out.replace(/\uE000(\d+)\uE001/g,(_,i)=>tokens[Number(i)]);
   node.dataset.decorated='1';
 });
}
document.addEventListener('click',e=>{const w=e.target.closest('.linked-word');if(w){e.preventDefault();showDictByTerm(w.dataset.term);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();const w=e.target.closest?.('.linked-word');if(w&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showDictByTerm(w.dataset.term);}});
// HIT THE CEILING iframe close bridge: the game posts this event to the parent.
window.addEventListener('message',e=>{if(e.data&&e.data.type==='IAE_HIT_CEILING_CLOSE'){returnToPreviousView();}});
function initMainContentContainer(){const host=getMainHost();if(host&&host.innerHTML.trim()==='')showPage('topicsPage');}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initMainContentContainer,{once:true});else initMainContentContainer();
</script>
