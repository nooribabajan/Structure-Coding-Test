
name: PHY08 Chromium Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'Physics/Phy08/**'
      - '.github/workflows/phy08-chromium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: PHY08 — Chromium Runtime Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PHY08 file
        shell: bash
        run: |
          set -euo pipefail

          FILE="Physics/Phy08/index.html"
          test -f "$FILE"

          grep -Fq '<title>PHY08</title>' "$FILE"

          for FUNCTION in \
            'function showPage' \
            'function renderTopics' \
            'function openTopic' \
            'function openFunctional' \
            'function openVisualAtlas' \
            'function openTopicTranslation'; do
            grep -Fq "$FUNCTION" "$FILE" || {
              echo "FAIL: Missing $FUNCTION"
              exit 1
            }
          done

          echo "PASS: PHY08 file and required functions found"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-dev playwright http-server
          npx playwright install --with-deps chromium

      - name: Start local web server
        shell: bash
        run: |
          set -euo pipefail

          npx http-server . -p 4173 > server.log 2>&1 &
          echo $! > server.pid

          for i in {1..30}; do
            if curl -fsS \
              "http://127.0.0.1:4173/Physics/Phy08/index.html" \
              >/dev/null; then
              echo "PASS: PHY08 server responds"
              exit 0
            fi
            sleep 1
          done

          cat server.log
          echo "FAIL: PHY08 server did not start"
          exit 1

      - name: Run PHY08 Chromium diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ccsv4-evidence

          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const url =
              'http://127.0.0.1:4173/Physics/Phy08/index.html';

            const evidence = {
              target: 'PHY08',
              url,
              testedAt: new Date().toISOString(),
              browserVersion: null,
              checks: {},
              topics: [],
              scrollTests: {},
              translationTests: {},
              pageErrors: []
            };

            const browser = await chromium.launch({ headless: true });
            evidence.browserVersion = browser.version();

            const page = await browser.newPage();

            page.on('pageerror', error => {
              evidence.pageErrors.push(error.message);
            });

            const waitForUI = () =>
              page.waitForTimeout(300);

            const visible = async selector =>
              page.locator(selector).isVisible().catch(() => false);

            const assert = (condition, message) => {
              if (!condition) throw new Error(message);
            };

            try {
              // 1. Load the real PHY08 page.
              const response = await page.goto(url, {
                waitUntil: 'domcontentloaded'
              });

              assert(
                response && response.ok(),
                'PHY08 did not return a successful HTTP response'
              );

              await page.waitForLoadState('networkidle')
                .catch(() => {});

              assert(
                await page.title() === 'PHY08',
                'Incorrect page title'
              );

              evidence.checks.pageLoad = 'PASS';

              // 2. Check JavaScript entry points.
              const names = [
                'showPage',
                'renderTopics',
                'openTopic',
                'openFunctional',
                'openVisualAtlas',
                'openTopicTranslation',
                'closeP03Translation'
              ];

              const functions = await page.evaluate(names =>
                names.map(name => ({
                  name,
                  exists: typeof window[name] === 'function'
                })), names);

              evidence.checks.functions = functions;

              const missing = functions.filter(x => !x.exists);

              assert(
                missing.length === 0,
                'Missing functions: ' +
                  missing.map(x => x.name).join(', ')
              );

              // 3. Check main page sections.
              const pageIds = [
                'homePage',
                'topicsPage',
                'topicPage',
                'functionalPage',
                'hitCeilingPage'
              ];

              for (const id of pageIds) {
                assert(
                  await page.locator('#' + id).count() > 0,
                  'Missing page section: ' + id
                );
              }

              evidence.checks.pageSections = 'PASS';

              // 4. Open the topic selection page.
              await page.evaluate(() => {
                window.showPage('topicsPage');
              });

              const topicTabs = page.locator(
                '#topicsPage .topic-grid .main-topic-large'
              );

              await topicTabs.first().waitFor({ state: 'visible' });

              const count = await topicTabs.count();

              assert(count > 0, 'No topic tabs were rendered');

              evidence.checks.topicTabCount = count;

              // 5. Open every topic and verify its content.
              for (let n = 1; n <= count; n++) {
                await page.evaluate(n => {
                  window.openTopic(n);
                }, n);

                const topicDocument = page.locator(
                  `#topicContentView .topic-document[data-topic="${n}"]`
                );

                await topicDocument.waitFor({ state: 'attached' });

                const content = (
                  await topicDocument.innerText()
                ).trim();

                assert(
                  content.length > 0,
                  'Topic ' + n + ' rendered empty content'
                );

                evidence.topics.push({
                  topic: n,
                  contentCharacters: content.length,
                  status: 'PASS'
                });
              }

              evidence.checks.topicNavigation = 'PASS';

              // 6. Verify the Visual Atlas.
              await page.evaluate(() => {
                window.openFunctional('visual');
              });

              await page.locator(
                '#functionalContentView .visual-atlas-document'
              ).waitFor({ state: 'attached' });

              const visualSections = await page.locator(
                '#functionalContentView .visual-atlas-topic'
              ).count();

              assert(
                visualSections > 0,
                'Visual Atlas has no topic sections'
              );

              evidence.checks.visualAtlas = {
                status: 'PASS',
                topicSections: visualSections
              };

              // 7. Verify Hit The Ceiling navigation.
              await page.evaluate(() => {
                window.showPage('topicsPage');
              });

              const hitTab = page.locator('#topicsPage .tab')
                .filter({ hasText: /Hit The Ceiling/i })
                .first();

              await hitTab.waitFor({ state: 'visible' });
              await hitTab.click();

              await page.locator(
                '#hitCeilingPage.active'
              ).waitFor({ state: 'attached' });

              evidence.checks.hitTheCeiling = 'PASS';

              // 8. Test global scroll controls on a real topic.
              await page.evaluate(() => {
                window.openTopic(1);
              });

              await page.locator(
                '#topicPage.active .main-content-container'
              ).waitFor({ state: 'visible' });

              await waitForUI();

              const scroller = page.locator(
                '#topicPage.active .main-content-container'
              );

              const scrollMetrics = await scroller.evaluate(el => ({
                scrollHeight: el.scrollHeight,
                clientHeight: el.clientHeight,
                maxScroll: Math.max(
                  0, el.scrollHeight - el.clientHeight
                )
              }));

              evidence.scrollTests.metrics = scrollMetrics;

              if (scrollMetrics.maxScroll <= 8) {
                // A page without scrolling space should only show
                // the Previous Page control.
                await scroller.evaluate(el => {
                  el.scrollTop = 0;
                  el.dispatchEvent(new Event('scroll'));
                });

                await waitForUI();

                const state = {
                  system: await visible('#globalScrollSystem'),
                  arrow: await visible('#globalScrollArrow'),
                  previous: await visible('#globalScrollPrevious')
                };

                evidence.scrollTests.noScroll = state;

                assert(
                  !state.system && !state.arrow && state.previous,
                  'No-scroll state must show Previous Page only'
                );

                evidence.scrollTests.status = 'PASS';
              } else {
                // Test the top of the scrollable page.
                await scroller.evaluate(el => {
                  el.scrollTop = 0;
                  el.dispatchEvent(new Event('scroll'));
                });

                await waitForUI();

                const topState = {
                  system: await visible('#globalScrollSystem'),
                  arrow: await visible('#globalScrollArrow'),
                  previous: await visible('#globalScrollPrevious')
                };

                evidence.scrollTests.top = topState;

                assert(
                  !topState.previous,
                  'Previous Page must not appear at the top'
                );

                assert(
                  topState.system || topState.arrow,
                  'No scroll control appeared at the top'
                );

                // Test the speed selector.
                if (topState.system) {
                  await page.locator(
                    '#globalScrollSpeedButton'
                  ).click();

                  await page.locator(
                    '#globalScrollSpeed .global-scroll-speed-menu ' +
                    'button[data-speed="2"]'
                  ).click();

                  const speedText = await page.locator(
                    '#globalScrollSpeedButton'
                  ).innerText();

                  evidence.scrollTests.speed = speedText;

                  assert(
                    speedText.trim() === '2x',
                    'Selecting speed 2 did not set the 2x label'
                  );

                  // Test auto-scroll ON and OFF.
                  await page.locator('#globalScrollAction').click();
                  await waitForUI();

                  const runningText = (
                    await page.locator('#globalScrollAction').innerText()
                  ).trim();

                  evidence.scrollTests.autoScrollStarted = runningText;

                  assert(
                    runningText === 'Off',
                    'Auto-scroll did not change the button to Off'
                  );

                  await page.locator('#globalScrollAction').click();
                  await waitForUI();

                  const stoppedText = (
                    await page.locator('#globalScrollAction').innerText()
                  ).trim();

                  evidence.scrollTests.autoScrollStopped = stoppedText;

                  assert(
                    stoppedText === 'On',
                    'Auto-scroll did not stop correctly'
                  );
                }

                // Test the middle of the page.
                await scroller.evaluate(el => {
                  el.scrollTop = Math.floor(
                    (el.scrollHeight - el.clientHeight) / 2
                  );
                  el.dispatchEvent(new Event('scroll'));
                });

                await waitForUI();

                const middleState = {
                  system: await visible('#globalScrollSystem'),
                  arrow: await visible('#globalScrollArrow'),
                  previous: await visible('#globalScrollPrevious')
                };

                evidence.scrollTests.middle = middleState;

                assert(
                  !middleState.previous,
                  'Previous Page appeared in the middle of the page'
                );

                assert(
                  middleState.system || middleState.arrow,
                  'No scroll control appeared in the middle'
                );

                // Test the bottom of the page.
                await scroller.evaluate(el => {
                  el.scrollTop = el.scrollHeight;
                  el.dispatchEvent(new Event('scroll'));
                });

                await waitForUI();

                const bottomState = {
                  system: await visible('#globalScrollSystem'),
                  arrow: await visible('#globalScrollArrow'),
                  previous: await visible('#globalScrollPrevious')
                };

                evidence.scrollTests.bottom = bottomState;

                assert(
                  !bottomState.system &&
                  !bottomState.arrow &&
                  bottomState.previous,
                  'At the bottom, Previous Page must be the only control'
                );

                // Verify Previous Page returns to topic selection.
                await page.locator('#globalScrollPrevious').click();

                await page.locator(
                  '#topicsPage.active'
                ).waitFor({ state: 'attached' });

                evidence.scrollTests.previousPageNavigation = 'PASS';
                evidence.scrollTests.status = 'PASS';
              }

              // 9. Test Urdu and Pashto translation selection.
              await page.evaluate(() => {
                window.openTopic(1);
              });

              const translateButton = page.locator(
                '#topicContentView .english-study-toolbar ' +
                '.topic-translate-btn'
              ).first();

              await translateButton.waitFor({ state: 'visible' });

              for (const language of ['ur', 'ps']) {
                // Open the topic's translation-language menu.
                await translateButton.click();

                const languageButton = page.locator(
                  '#p03TranslateMenu .' +
                  (language === 'ur' ? 'ur-option' : 'ps-option')
                );

                await languageButton.waitFor({ state: 'visible' });
                await languageButton.click();

                await page.locator(
                  '#p03TranslationOverlay.visible'
                ).waitFor({ state: 'attached' });

                await waitForUI();

                const translationState = await page.evaluate(() => {
                  const overlay = document.querySelector(
                    '#p03TranslationOverlay'
                  );
                  const content = document.querySelector(
                    '#p03TranslationContent'
                  );

                  return {
                    overlayVisible:
                      !!overlay?.classList.contains('visible'),
                    direction: content?.getAttribute('dir') || null,
                    contentCharacters:
                      (content?.innerText || '').trim().length
                  };
                });

                evidence.translationTests[language] = translationState;

                assert(
                  translationState.overlayVisible,
                  'Translation overlay failed for ' + language
                );

                assert(
                  translationState.direction === 'rtl',
                  'Translation direction is not RTL for ' + language
                );

                assert(
                  translationState.contentCharacters > 0,
                  'Translation content is empty for ' + language
                );

                await page.evaluate(() => {
                  window.closeP03Translation();
                });

                await waitForUI();
              }

              evidence.checks.translationLanguages = 'PASS';

              // 10. Fail if the browser reported uncaught JS errors.
              if (evidence.pageErrors.length) {
                throw new Error(
                  'Uncaught browser errors: ' +
                  evidence.pageErrors.join(' | ')
                );
              }

              evidence.checks.uncaughtPageErrors = 'PASS';
              evidence.result = 'PASS';

            } catch (error) {
              evidence.result = 'FAIL';
              evidence.failure = error.stack || String(error);
              throw error;

            } finally {
              fs.writeFileSync(
                'ccsv4-evidence/lecture-PHY08.json',
                JSON.stringify(evidence, null, 2)
              );

              console.log(JSON.stringify(evidence, null, 2));

              await browser.close();
            }
          })().catch(error => {
            console.error(error.stack || String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Upload PHY08 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PHY08-chromium-runtime-evidence
          path: |
            ccsv4-evidence/
            server.log
          if-no-files-found: warn
