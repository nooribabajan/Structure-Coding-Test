name: CCSV4 Permanent Runtime Gate — Chromium Diagnostics

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      lecture:
        description: "Optional lecture number. Leave blank to auto-detect."
        required: false
        default: ""

permissions:
  contents: read

jobs:

  detect:
    name: CCSV4 — Detect Test Targets
    runs-on: ubuntu-latest
    outputs:
      lectures: ${{ steps.detect.outputs.lectures }}
      count: ${{ steps.detect.outputs.count }}

    steps:

      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected or latest lecture
        id: detect
        shell: bash
        run: |

          set -euo pipefail

          TARGETS=""

          #
          # MANUAL RUN
          #

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then

            requested=$(jq -r '.inputs.lecture // ""' "$GITHUB_EVENT_PATH")

            if [ -n "$requested" ]; then

              if ! [[ "$requested" =~ ^[0-9]+$ ]]; then
                echo "CCSV4 DETECTION FAILURE"
                echo "PROBLEM_CODE=INVALID_LECTURE_INPUT"
                exit 1
              fi

              FILE="First-Year/Chemi${requested}/index.html"

              if [ ! -f "$FILE" ]; then
                echo "CCSV4 DETECTION FAILURE"
                echo "PROBLEM_CODE=MISSING_LECTURE_FILE"
                echo "Missing: $FILE"
                exit 1
              fi

              TARGETS="$requested"

            fi

          fi

          #
          # AUTOMATIC COMMIT DETECTION
          #

          if [ -z "$TARGETS" ]; then

            BEFORE=$(jq -r '.before // ""' "$GITHUB_EVENT_PATH")
            AFTER="$GITHUB_SHA"

            if [ -n "$BEFORE" ] &&
               [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then

              CHANGED_FILES=$(
                git diff --name-only \
                  "$BEFORE" \
                  "$AFTER" \
                  -- \
                  'First-Year/Chemi*/**' \
                  '.github/workflows/**'
              )

            else

              CHANGED_FILES=$(
                git ls-tree \
                  -r \
                  --name-only \
                  "$AFTER" \
                  -- \
                  'First-Year/Chemi*/**'
              )

            fi

            #
            # Find lectures whose actual files changed.
            #

            TARGETS=$(
              printf '%s\n' "$CHANGED_FILES" |
              sed -nE \
                's#^First-Year/Chemi([0-9]+)/.*#\1#p' |
              sort -n -u |
              paste -sd ',' -
            )

          fi

          #
          # IMPORTANT:
          # If only workflow/system files changed,
          # do NOT skip the runtime test.
          #
          # Instead test the newest committed lecture.
          #

          if [ -z "$TARGETS" ]; then

            echo "No lecture-specific change detected."

            LATEST=$(
              find First-Year \
                -type f \
                -path '*/Chemi*/index.html' |
              grep -E '/Chemi[0-9]+/index\.html$' |
              sort -V |
              tail -n 1 || true
            )

            if [ -z "$LATEST" ]; then

              echo "CCSV4 DETECTION FAILURE"
              echo "PROBLEM_CODE=NO_LECTURE_FILES_FOUND"
              exit 1

            fi

            TARGETS=$(
              echo "$LATEST" |
              sed -E \
                's#^First-Year/Chemi([0-9]+)/index\.html$#\1#'
            )

            echo "System-only commit detected."
            echo "Testing latest committed lecture: $TARGETS"

          fi

          COUNT=$(
            echo "$TARGETS" |
            tr ',' '\n' |
            sed '/^$/d' |
            wc -l
          )

          echo "Detected lectures: $TARGETS"
          echo "Count: $COUNT"

          echo "lectures=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"


  runtime:
    name: CCSV4 — Chromium Runtime Diagnostic
    needs: detect

    if: needs.detect.outputs.count != '0'

    runs-on: ubuntu-latest

    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        lecture:
          - ${{ needs.detect.outputs.lectures }}

    steps:

      - name: Checkout exact committed version
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install latest Playwright
        shell: bash
        run: |

          set -euo pipefail

          npm init -y

          npm install \
            --save-dev \
            playwright@latest

          echo ""
          echo "=========================================="
          echo "PLAYWRIGHT VERSION"
          echo "=========================================="

          npx playwright --version

          echo ""
          echo "Installing bundled Chromium..."

          npx playwright install --with-deps chromium

      - name: Validate target lecture
        shell: bash
        run: |

          set -euo pipefail

          LECTURES="${{ needs.detect.outputs.lectures }}"

          echo "Runtime target(s):"
          echo "$LECTURES"

          while IFS= read -r lecture; do

            [ -z "$lecture" ] && continue

            FILE="First-Year/Chemi${lecture}/index.html"

            echo ""
            echo "Checking:"
            echo "$FILE"

            if [ ! -f "$FILE" ]; then

              echo "CCSV4 FAILURE"
              echo "PROBLEM_CODE=MISSING_LECTURE_FILE"
              echo "Missing: $FILE"

              exit 1

            fi

          done < <(echo "$LECTURES" | tr ',' '\n')

      - name: Start local lecture server
        shell: bash
        run: |

          set -euo pipefail

          npx --yes http-server \
            First-Year \
            -p 4173 \
            > server.log 2>&1 &

          echo $! > server.pid

          FIRST_LECTURE=$(
            echo "${{ needs.detect.outputs.lectures }}" |
            cut -d',' -f1
          )

          for i in {1..30}; do

            if curl -fsS \
              "http://127.0.0.1:4173/Chemi${FIRST_LECTURE}/index.html" \
              >/dev/null; then

              echo "CCSV4 PASS"
              echo "PROBLEM_CODE=NONE"
              echo "Local server is ready."

              exit 0

            fi

            sleep 1

          done

          echo "CCSV4 FAILURE"
          echo "PROBLEM_CODE=LOCAL_SERVER_START_FAILURE"

          cat server.log

          exit 1

      - name: Chromium — Deep CCSV4 tab diagnostic
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p ccsv4-evidence

          echo "${{ needs.detect.outputs.lectures }}" |
          tr ',' '\n' |
          while IFS= read -r lecture; do

            [ -z "$lecture" ] && continue

            echo ""
            echo "################################################"
            echo "CCSV4 RUNTIME TEST — LECTURE $lecture"
            echo "################################################"

            LECTURE="$lecture" node <<'NODE'

          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {

            const lecture = process.env.LECTURE;

            const url =
              `http://127.0.0.1:4173/Chemi${lecture}/index.html`;

            const evidence = {

              lecture,

              url,

              testedAt:
                new Date().toISOString(),

              playwright:
                require(
                  'playwright/package.json'
                ).version,

              chromium:
                null,

              tabs: [],

              consoleErrors: [],

              pageErrors: [],

              failedRequests: [],

              globalProblems: []

            };

            const browser =
              await chromium.launch({
                headless: true,
                args: [
                  '--disable-gpu'
                ]
              });

            evidence.chromium =
              await browser.version();

            const context =
              await browser.newContext();

            const page =
              await context.newPage();

            page.on(
              'console',
              message => {

                if (
                  message.type() ===
                  'error'
                ) {

                  evidence.consoleErrors.push(
                    message.text()
                  );

                }

              }
            );

            page.on(
              'pageerror',
              error => {

                evidence.pageErrors.push(
                  String(error)
                );

              }
            );

            page.on(
              'requestfailed',
              request => {

                evidence.failedRequests.push({

                  url:
                    request.url(),

                  method:
                    request.method(),

                  failure:
                    request.failure()

                });

              }
            );

            /*
             * ----------------------------------------
             * PAGE LOAD
             * ----------------------------------------
             */

            try {

              await page.goto(
                url,
                {
                  waitUntil:
                    'domcontentloaded'
                }
              );

              await page
                .waitForLoadState(
                  'networkidle'
                )
                .catch(() => {});

            } catch (error) {

              evidence.globalProblems.push({

                code:
                  'PAGE_LOAD_FAILURE',

                message:
                  String(error)

              });

            }

            /*
             * ----------------------------------------
             * REQUIRED CCSV4 FUNCTIONS
             * ----------------------------------------
             */

            const requiredFunctions =
              await page.evaluate(() => {

                const names = [

                  'showPage',
                  'openTopic',
                  'openSub',
                  'openFunctional',
                  'showVisual',
                  'returnToPreviousView'

                ];

                return names.map(
                  name => ({

                    name,

                    exists:
                      typeof window[name] ===
                      'function'

                  })
                );

              });

            evidence.requiredFunctions =
              requiredFunctions;

            for (
              const functionInfo
              of requiredFunctions
            ) {

              if (
                !functionInfo.exists
              ) {

                evidence.globalProblems.push({

                  code:
                    'MISSING_TAB_FUNCTION',

                  function:
                    functionInfo.name

                });

              }

            }

            /*
             * ----------------------------------------
             * TAB DISCOVERY
             * ----------------------------------------
             */

            const selector =
              '.topic-grid .tab, ' +
              '.topic-feature-row .tab, ' +
              '.lecture-navigation .previous-page-tab';

            const tabCount =
              await page
                .locator(selector)
                .count();

            evidence.tabCount =
              tabCount;

            if (!tabCount) {

              evidence.globalProblems.push({

                code:
                  'NO_TABS_FOUND',

                selector

              });

            }

            /*
             * ----------------------------------------
             * TAB DESCRIPTORS
             * ----------------------------------------
             */

            const descriptors =
              await page
                .locator(selector)
                .evaluateAll(
                  elements =>
                    elements.map(
                      (element, index) => ({

                        index,

                        label:
                          element.innerText
                            .trim(),

                        onclick:
                          element
                            .getAttribute(
                              'onclick'
                            ),

                        className:
                          element.className,

                        tagName:
                          element.tagName,

                        id:
                          element.id,

                        role:
                          element.getAttribute(
                            'role'
                          ),

                        disabled:
                          element.disabled ===
                          true

                      })
                    )
                );

            evidence.descriptors =
              descriptors;

            /*
             * ----------------------------------------
             * TEST EVERY TAB
             * ----------------------------------------
             */

            for (
              const descriptor
              of descriptors
            ) {

              /*
               * Fresh page for every tab.
               */

              await page.goto(
                url,
                {
                  waitUntil:
                    'domcontentloaded'
                }
              );

              await page
                .waitForLoadState(
                  'networkidle'
                )
                .catch(() => {});

              /*
               * Instrument functions.
               */

              await page.evaluate(() => {

                window.__ccsv4Calls = [];

                const names = [

                  'showPage',
                  'openTopic',
                  'openSub',
                  'openFunctional',
                  'showVisual',
                  'returnToPreviousView'

                ];

                for (
                  const name
                  of names
                ) {

                  const original =
                    window[name];

                  if (
                    typeof original !==
                    'function'
                  ) {
                    continue;
                  }

                  window[name] =
                    function (...args) {

                      window
                        .__ccsv4Calls
                        .push({

                          name,

                          args:
                            args.map(
                              value => {

                                if (
                                  value !==
                                    null &&
                                  typeof value ===
                                    'object'
                                ) {

                                  return '[object]';

                                }

                                return value;

                              }
                            )

                        });

                      return original.apply(
                        this,
                        args
                      );

                    };

                }

              });

              const tab =
                page
                  .locator(selector)
                  .nth(
                    descriptor.index
                  );

              /*
               * Verify tab still exists
               * after reload.
               */

              if (
                !(await tab.count())
              ) {

                evidence.tabs.push({

                  ...descriptor,

                  status:
                    'FAIL',

                  problemCode:
                    'TAB_DISAPPEARED_AFTER_RELOAD'

                });

                continue;

              }

              await tab
                .scrollIntoViewIfNeeded();

              /*
               * BEFORE STATE
               */

              const before =
                await page.evaluate(() => {

                  const visibleIds =
                    Array.from(
                      document
                        .querySelectorAll(
                          '[id]'
                        )
                    )
                    .filter(
                      element => {

                        const style =
                          getComputedStyle(
                            element
                          );

                        return (
                          style.display !==
                            'none' &&
                          style.visibility !==
                            'hidden'
                        );

                      }
                    )
                    .map(
                      element =>
                        element.id
                    )
                    .filter(Boolean);

                  const activeTabs =
                    Array.from(
                      document
                        .querySelectorAll(
                          '.tab.active, ' +
                          '.tab[aria-selected="true"]'
                        )
                    )
                    .map(
                      element =>
                        element.innerText.trim()
                    );

                  return {

                    href:
                      location.href,

                    visibleIds,

                    activeTabs,

                    bodyText:
                      document.body
                        .innerText
                        .slice(
                          0,
                          6000
                        )

                  };

                });

              /*
               * REAL BROWSER CLICK
               */

              let clickError =
                null;

              try {

                await tab.click({
                  force: true
                });

              } catch (error) {

                clickError =
                  String(error);

              }

              await page.waitForTimeout(
                700
              );

              /*
               * AFTER STATE
               */

              const after =
                await page.evaluate(() => {

                  const visibleIds =
                    Array.from(
                      document
                        .querySelectorAll(
                          '[id]'
                        )
                    )
                    .filter(
                      element => {

                        const style =
                          getComputedStyle(
                            element
                          );

                        return (
                          style.display !==
                            'none' &&
                          style.visibility !==
                            'hidden'
                        );

                      }
                    )
                    .map(
                      element =>
                        element.id
                    )
                    .filter(Boolean);

                  const activeTabs =
                    Array.from(
                      document
                        .querySelectorAll(
                          '.tab.active, ' +
                          '.tab[aria-selected="true"]'
                        )
                    )
                    .map(
                      element =>
                        element.innerText.trim()
                    );

                  return {

                    href:
                      location.href,

                    visibleIds,

                    activeTabs,

                    bodyText:
                      document.body
                        .innerText
                        .slice(
                          0,
                          6000
                        )

                  };

                });

              const calls =
                await page.evaluate(
                  () =>
                    window
                      .__ccsv4Calls || []
                );

              const functionInvoked =
                calls.length > 0;

              const stateChanged =
                JSON.stringify(before) !==
                JSON.stringify(after);

              /*
               * ----------------------------------------
               * DIAGNOSTIC PROBLEM CLASSIFICATION
               * ----------------------------------------
               */

              let status =
                'PASS';

              let problemCode =
                'NONE';

              if (clickError) {

                status =
                  'FAIL';

                problemCode =
                  'BROWSER_CLICK_FAILURE';

              }

              else if (
                !functionInvoked &&
                !stateChanged
              ) {

                status =
                  'FAIL';

                problemCode =
                  'TAB_FUNCTION_AND_STATE_FAILURE';

              }

              else if (
                !functionInvoked
              ) {

                status =
                  'FAIL';

                problemCode =
                  'TAB_NO_FUNCTION_INVOCATION';

              }

              else if (
                !state
