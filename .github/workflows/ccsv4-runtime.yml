name: CCSV4 Permanent Runtime Gate — Chromium Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lecture:
        description: "Lecture number, e.g. 23. Leave blank to test the latest lecture."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  detect:
    name: CCSV4 — Detect Lecture
    runs-on: ubuntu-latest
    outputs:
      lectures: ${{ steps.detect.outputs.lectures }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect lecture target
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          requested="$(jq -r '.inputs.lecture // ""' "$GITHUB_EVENT_PATH")"

          if [ -n "$requested" ]; then
            if ! [[ "$requested" =~ ^[0-9]+$ ]]; then
              echo "Invalid lecture number: $requested"
              exit 1
            fi
            file="First-Year/Chemi${requested}/index.html"
            test -f "$file" || { echo "Missing $file"; exit 1; }
            echo "lectures=[\"$requested\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t found < <(
            find First-Year -type f -path '*/Chemi*/index.html' |
            sed -nE 's#^First-Year/Chemi([0-9]+)/index\.html$#\1#p' |
            sort -n -u
          )

          if [ "${#found[@]}" -eq 0 ]; then
            echo "No lecture files found."
            exit 1
          fi

          targets=()
          before="$(jq -r '.before // ""' "$GITHUB_EVENT_PATH")"

          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            while IFS= read -r f; do
              n="$(sed -nE 's#^First-Year/Chemi([0-9]+)/.*#\1#p' <<< "$f")"
              [ -n "$n" ] && targets+=("$n")
            done < <(git diff --name-only "$before" "$GITHUB_SHA" -- 'First-Year/Chemi*/**')
          fi

          if [ "${#targets[@]}" -eq 0 ]; then
            targets=("${found[${#found[@]}-1]}")
          fi

          mapfile -t unique < <(printf '%s\n' "${targets[@]}" | sort -n -u)
          json="$(printf '%s\n' "${unique[@]}" | jq -R . | jq -sc .)"
          echo "Testing lectures: $json"
          echo "lectures=$json" >> "$GITHUB_OUTPUT"

  runtime:
    name: CCSV4 — Chromium Runtime Diagnostic
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        lecture: ${{ fromJSON(needs.detect.outputs.lectures) }}

    steps:
      - name: Checkout exact committed version
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-dev playwright@latest
          npx playwright install --with-deps chromium

      - name: Validate lecture
        shell: bash
        run: |
          set -euo pipefail
          file="First-Year/Chemi${{ matrix.lecture }}/index.html"
          test -f "$file" || { echo "Missing $file"; exit 1; }

          grep -q "MASTERY_TTS_LANG.*ur-PK" "$file" || {
            echo "Urdu TTS marker not found in $file"
            exit 1
          }

          if grep -qi "64-bit" "$file"; then
            echo "CCSV4 FAILURE: forbidden 64-bit/heavy embedded marker found."
            exit 1
          fi

      - name: Start local server
        shell: bash
        run: |
          set -euo pipefail
          npx --yes http-server First-Year -p 4173 > server.log 2>&1 &
          echo $! > server.pid

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173/Chemi${{ matrix.lecture }}/index.html" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat server.log
          exit 1

      - name: Chromium — CCSV4 functional gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ccsv4-evidence

          LECTURE="${{ matrix.lecture }}" node > "ccsv4-evidence/lecture-${{ matrix.lecture }}.json" <<'NODE'
const { chromium } = require('playwright');
const fs = require('fs');

(async () => {
  const lecture = process.env.LECTURE;
  const url = `http://127.0.0.1:4173/Chemi${lecture}/index.html`;

  const evidence = {
    lecture,
    url,
    testedAt: new Date().toISOString(),
    chromium: null,
    requiredFunctions: [],
    tabCount: 0,
    tabResults: [],
    visualAtlas: null,
    hitTheCeiling: null,
    errors: []
  };

  const browser = await chromium.launch({ headless: true });
  evidence.chromium = browser.version();

  const page = await browser.newPage();

  page.on('pageerror', e =>
    evidence.errors.push({ type: 'pageerror', message: String(e) })
  );

  page.on('console', m => {
    if (m.type() === 'error') {
      evidence.errors.push({ type: 'console', message: m.text() });
    }
  });

  page.on('requestfailed', r =>
    evidence.errors.push({
      type: 'requestfailed',
      url: r.url(),
      failure: r.failure()
    })
  );

  await page.goto(url, { waitUntil: 'domcontentloaded' });
  await page.waitForLoadState('networkidle').catch(() => {});

  const required = [
    'showPage',
    'openموضوع',
    'openSub',
    'openFunctional',
    'showویژول',
    'returnToPreviousView'
  ];

  evidence.requiredFunctions = await page.evaluate(
    names => names.map(name => ({
      name,
      exists: typeof window[name] === 'function'
    })),
    required
  );

  for (const item of evidence.requiredFunctions) {
    if (!item.exists) {
      throw new Error(`MISSING_REQUIRED_FUNCTION:${item.name}`);
    }
  }

  const selector = '.topic-feature-row .tab, .topic-grid .tab';
  evidence.tabCount = await page.locator(selector).count();

  if (evidence.tabCount < 30) {
    throw new Error(`TOO_FEW_CCSV4_TABS:${evidence.tabCount}`);
  }

  const descriptors = await page.locator(selector).evaluateAll(els =>
    els.map((el, i) => ({
      index: i,
      label: el.innerText.trim(),
      onclick: el.getAttribute('onclick')
    }))
  );

  for (const d of descriptors) {
    await page.goto(url, { waitUntil: 'domcontentloaded' });
    await page.waitForLoadState('networkidle').catch(() => {});

    const tab = page.locator(selector).nth(d.index);

    if (!(await tab.count())) {
      throw new Error(`TAB_DISAPPEARED:${d.index}`);
    }

    const before = await page.locator('body').innerText;

    let clickError = null;
    try {
      await tab.scrollIntoViewIfNeeded();
      await tab.click({ force: true });
    } catch (e) {
      clickError = String(e);
    }

    await page.waitForTimeout(500);

    const after = await page.locator('body').innerText;

    if (clickError) {
      throw new Error(`TAB_CLICK_FAILURE:${d.index}:${clickError}`);
    }

    if (before === after) {
      const active = await page.locator('.page.active').count();
      if (!active) {
        throw new Error(`TAB_NO_VISIBLE_CHANGE:${d.index}:${d.label}`);
      }
    }

    evidence.tabResults.push({
      index: d.index,
      label: d.label,
      onclick: d.onclick,
      status: 'PASS'
    });
  }

  // Visual Atlas: open Atlas, then open a visual inside the page.
  await page.goto(url, { waitUntil: 'domcontentloaded' });
  await page.evaluate(() => window.openFunctional('visual'));
  await page.waitForTimeout(300);

  const visualButton =
    page.getByRole('button', { name: /Visual کھولیں/ }).first();

  evidence.visualAtlas = {
    buttonFound: (await visualButton.count()) > 0
  };

  if (!evidence.visualAtlas.buttonFound) {
    throw new Error('VISUAL_ATLAS_BUTTON_MISSING');
  }

  await visualButton.click();
  await page.waitForTimeout(500);

  evidence.visualAtlas.modalFound =
    (await page.locator('#visualPopupOverlay, .visual-popup-overlay').count()) > 0;

  if (!evidence.visualAtlas.modalFound) {
    throw new Error('VISUAL_DID_NOT_OPEN_IN_PAGE');
  }

  // Hit The Ceiling must open from its actual tab.
  await page.goto(url, { waitUntil: 'domcontentloaded' });

  const hitTab =
    page.locator('.topic-grid .tab')
      .filter({ hasText: /ہِٹ دی سیلنگ|HIT THE CEILING/i })
      .first();

  evidence.hitTheCeiling = {
    tabFound: (await hitTab.count()) > 0
  };

  if (!evidence.hitTheCeiling.tabFound) {
    throw new Error('HIT_THE_CEILING_TAB_MISSING');
  }

  await hitTab.click({ force: true });
  await page.waitForTimeout(400);

  evidence.hitTheCeiling.pageFound =
    (await page.locator('#hitCeilingPage.page.active, #hitCeilingPage').count()) > 0;

  if (!evidence.hitTheCeiling.pageFound) {
    throw new Error('HIT_THE_CEILING_PAGE_DID_NOT_OPEN');
  }

  await browser.close();

  fs.writeFileSync(
    '/tmp/evidence.json',
    JSON.stringify(evidence, null, 2)
  );

  console.log(JSON.stringify(evidence, null, 2));
})().catch(err => {
  console.error(err.stack || String(err));
  process.exitCode = 1;
});
NODE

      - name: Upload CCSV4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCSV4-runtime-evidence-lecture-${{ matrix.lecture }}
          path: ccsv4-evidence/
          if-no-files-found: warn
