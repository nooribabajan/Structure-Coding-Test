name: CCSV4 Runtime Chromium

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'First-Year/Chemi22/**'
      - '.github/workflows/ccsv4-runtime.yml'

permissions:
  contents: read

jobs:
  runtime-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Start local lecture server
        run: |
          python3 -m http.server 4173 --directory . >/tmp/ccsv4-server.log 2>&1 &
          sleep 2

      - name: Runtime Chromium diagnostic test
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless:true});

            const page = await browser.newPage({
              viewport: {width:390, height:844},
              deviceScaleFactor: 1
            });

            const errors = [];
            const httpErrors = [];
            const failedRequests = [];

            page.on('console', message => {
              if (message.type() === 'error') {
                errors.push({
                  type: 'console',
                  text: message.text(),
                  location: message.location()
                });
              }
            });

            page.on('pageerror', error => {
              errors.push({
                type: 'pageerror',
                text: error.message,
                stack: error.stack || ''
              });
            });

            page.on('response', response => {
              if (response.status() >= 400) {
                httpErrors.push({
                  status: response.status(),
                  statusText: response.statusText(),
                  url: response.url(),
                  resourceType: response.request().resourceType(),
                  method: response.request().method()
                });
              }
            });

            page.on('requestfailed', request => {
              failedRequests.push({
                url: request.url(),
                resourceType: request.resourceType(),
                method: request.method(),
                failure: request.failure()
              });
            });

            const url =
              'http://127.0.0.1:4173/First-Year/Chemi22/index.html';

            const response = await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 30000
            });

            if (!response || !response.ok()) {
              throw new Error(
                'Lecture 21 failed to load: HTTP ' +
                (response && response.status()) +
                ' ' +
                (response && response.statusText())
              );
            }

            await page.screenshot({
              path: 'ccsv4-runtime.png',
              fullPage: false
            });

            console.log('TITLE:', await page.title());
            console.log('URL:', page.url());

            console.log('\n=== HTTP ERRORS (400+) ===');

            if (!httpErrors.length) {
              console.log('NONE');
            } else {
              for (const error of httpErrors) {
                console.log(JSON.stringify(error));
              }
            }

            console.log('\n=== FAILED REQUESTS ===');

            if (!failedRequests.length) {
              console.log('NONE');
            } else {
              for (const error of failedRequests) {
                console.log(JSON.stringify(error));
              }
            }

            console.log('\n=== JAVASCRIPT / CONSOLE ERRORS ===');

            if (!errors.length) {
              console.log('NONE');
            } else {
              for (const error of errors) {
                console.log(JSON.stringify(error));
              }
            }

            console.log('\n=== DIAGNOSTIC SUMMARY ===');
            console.log('HTTP_ERRORS:', httpErrors.length);
            console.log('FAILED_REQUESTS:', failedRequests.length);
            console.log('JS_CONSOLE_ERRORS:', errors.length);

            if (
              httpErrors.length ||
              failedRequests.length ||
              errors.length
            ) {
              process.exitCode = 1;
            }

            await browser.close();

          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload runtime diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCSV4-Lecture21-runtime-diagnostic
          path: |
            ccsv4-runtime.png
            /tmp/ccsv4-server.log
          if-no-files-found: warn
