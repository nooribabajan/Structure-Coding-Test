name: CCSV4 Runtime Chromium — Last Committed Lecture

on:
  workflow_dispatch:
    inputs:
      lecture:
        description: "Lecture number to test (example: 22)"
        required: true
        default: "22"

  push:
    branches:
      - main
    paths:
      - 'First-Year/Chemi*/**'
      - '.github/workflows/ccsv4-runtime.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest committed repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine lecture to test
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then

            lecture=$(jq -r '.inputs.lecture // "22"' "$GITHUB_EVENT_PATH")

            if ! [[ "$lecture" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Lecture number must be numeric."
              exit 1
            fi

            FILE="First-Year/Chemi${lecture}/index.html"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Requested lecture file does not exist:"
              echo "$FILE"
              exit 1
            fi

            echo "lecture=$lecture" >> "$GITHUB_OUTPUT"
            echo "file=$FILE" >> "$GITHUB_OUTPUT"

            echo "Manual runtime target:"
            echo "$FILE"

          else

            echo "Finding the most recently committed Chemistry lecture index.html..."

            latest_path=$(
              git log -1 \
                --format='%H' \
                -- ':(glob)First-Year/Chemi*/index.html' |
              xargs -I{} git show --format= --name-only {} 2>/dev/null |
              grep -E '^First-Year/Chemi[0-9]+/index\.html$' |
              head -n 1 || true
            )

            if [ -z "$latest_path" ]; then
              echo "Fallback: selecting highest-numbered Chemistry lecture."

              latest_path=$(
                find First-Year \
                  -type f \
                  -path '*/Chemi*/index.html' |
                grep -E '/Chemi[0-9]+/index\.html$' |
                sort -V |
                tail -n 1 || true
              )
            fi

            if [ -z "$latest_path" ]; then
              echo "ERROR: No Chemistry lecture index.html found."
              exit 1
            fi

            lecture=$(echo "$latest_path" |
              sed -E 's#^First-Year/Chemi([0-9]+)/index\.html$#\1#')

            if ! [[ "$lecture" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Could not determine lecture number."
              exit 1
            fi

            echo "lecture=$lecture" >> "$GITHUB_OUTPUT"
            echo "file=$latest_path" >> "$GITHUB_OUTPUT"

            echo "Latest committed lecture target:"
            echo "$latest_path"

          fi

      - name: Show exact commit under test
        shell: bash
        run: |
          echo "Repository HEAD:"
          git rev-parse HEAD

          echo
          echo "HEAD commit:"
          git log -1 --oneline --decorate

          echo
          echo "Lecture under test:"
          echo "${{ steps.target.outputs.lecture }}"

          echo
          echo "File under test:"
          echo "${{ steps.target.outputs.file }}"

          echo
          echo "File commit history:"
          git log -5 --oneline -- \
            "${{ steps.target.outputs.file }}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install latest Playwright
        shell: bash
        run: |
          npm init -y
          npm install --save-dev playwright@latest

          echo "Playwright version:"
          npx playwright --version

          echo
          echo "Installing bundled
